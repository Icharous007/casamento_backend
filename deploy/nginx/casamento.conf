limit_req_zone $binary_remote_addr zone=casamento_register:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=casamento_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=casamento_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name gustavoemalucasam.net.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/casamento/current;
    }

    location / {
        return 301 https://gustavoemalucasam.net.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gustavoemalucasam.net.br;

    root /var/www/casamento/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/gustavoemalucasam.net.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gustavoemalucasam.net.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12M;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /api/v1/guest-access/register {
        limit_req zone=casamento_register burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/admin/auth/login {
        limit_req zone=casamento_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        limit_req zone=casamento_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /q/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* (^|/)(\.env|\.git|.*\.(bak|backup|old|save|secret))$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}